<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Test - Bricklapse</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #image-wrapper {
      position: relative;
      display: inline-block;
      margin-top: 1em;
      border: 2px solid #333;
    }
    #test-image {
      max-width: 100%;
      display: block; /* remove inline gap */
    }
    #peaking-canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div class="container mt-4">
  <h2><a href="/">Lego Timelapse</a> - Camera Test</h2>
  <p>Use this page to capture a test image from the Raspberry Pi HQ camera and verify focus/aperture.</p>
  <div class="form-inline mb-2">
    <label for="method-select" class="mr-2 font-weight-bold">Method:</label>
    <select id="method-select" class="form-control mr-3">
      <option value="auto">auto (priority: picamera2 -> opencv -> rpicam -> raspistill)</option>
      <option value="picamera2">picamera2 (libcamera native)</option>
      <option value="opencv">opencv (V4L2)</option>
      <option value="rpicam">rpicam-still (CLI)</option>
      <option value="raspistill">raspistill (legacy)</option>
    </select>
    <button id="capture-btn" class="btn btn-primary">Capture Test Image</button>
  </div>
  <div id="status" class="mt-2"></div>
  <div class="mt-3" id="focus-controls" style="display:none;">
    <div class="form-inline mb-2">
      <button id="toggle-peaking" class="btn btn-sm btn-secondary mr-2">Enable Focus Peaking</button>
      <label for="peaking-threshold" class="mr-2 mb-0">Threshold:</label>
      <input type="range" id="peaking-threshold" min="5" max="80" value="25" class="mr-3" />
      <label for="peaking-intensity" class="mr-2 mb-0">Intensity:</label>
      <input type="range" id="peaking-intensity" min="50" max="255" value="180" />
      <span class="ml-3">Focus Score: <span id="focus-score">-</span></span>
    </div>
  </div>
  <div id="image-wrapper">
    <div id="image-container" class="mt-3"></div>
    <canvas id="peaking-canvas" style="display:none;"></canvas>
  </div>
</div>
<script>
  // Restore last selected method
  const selectEl = document.getElementById('method-select');
  const savedMethod = localStorage.getItem('camera_test_method');
  if (savedMethod) {
    selectEl.value = savedMethod;
  }
  selectEl.addEventListener('change', () => {
    localStorage.setItem('camera_test_method', selectEl.value);
  });

  const focusControls = document.getElementById('focus-controls');
  const peakingCanvas = document.getElementById('peaking-canvas');
  const togglePeakingBtn = document.getElementById('toggle-peaking');
  const thresholdSlider = document.getElementById('peaking-threshold');
  const intensitySlider = document.getElementById('peaking-intensity');
  const focusScoreEl = document.getElementById('focus-score');
  let peakingEnabled = false;

  function enableControlsAfterImage() {
    focusControls.style.display = 'block';
  }

  function computeFocusPeaks(img) {
    // Prepare canvas sizes
    peakingCanvas.width = img.naturalWidth;
    peakingCanvas.height = img.naturalHeight;
    const ctx = peakingCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0,0,peakingCanvas.width, peakingCanvas.height);
    const {data, width, height} = imageData;

    // Convert to grayscale
    const gray = new Uint8ClampedArray(width*height);
    for (let i=0, j=0; i<data.length; i+=4, j++) {
      // Luminosity method
      gray[j] = (0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2])|0;
    }
    // Sobel operator
    const sobel = new Uint16Array(width*height);
    const kx = [-1,0,1,-2,0,2,-1,0,1];
    const ky = [-1,-2,-1,0,0,0,1,2,1];
    for (let y=1; y<height-1; y++) {
      for (let x=1; x<width-1; x++) {
        let gx=0, gy=0; let idx=0;
        for (let kyOff=-1; kyOff<=1; kyOff++) {
          for (let kxOff=-1; kxOff<=1; kxOff++) {
            const val = gray[(y+kyOff)*width + (x+kxOff)];
            const kIndex = (kyOff+1)*3 + (kxOff+1);
            gx += kx[kIndex]*val;
            gy += ky[kIndex]*val;
            idx++;
          }
        }
        const mag = Math.abs(gx) + Math.abs(gy); // L1 magnitude (cheaper)
        sobel[y*width + x] = mag;
      }
    }
    // Determine thresholded edges
    const threshold = parseInt(thresholdSlider.value,10);
    const intensity = parseInt(intensitySlider.value,10);
    const peakImg = ctx.createImageData(width,height);
    let sumMag=0, countMag=0; // focus score
    for (let i=0; i<sobel.length; i++) {
      const mag = sobel[i]>>3; // scale down
      if (mag > threshold) {
        peakImg.data[i*4] = intensity;      // R
        peakImg.data[i*4+1] = 0;            // G
        peakImg.data[i*4+2] = intensity;    // B (magenta overlay)
        peakImg.data[i*4+3] = 180;          // Alpha
        sumMag += mag; countMag++;
      } else {
        peakImg.data[i*4+3] = 0; // transparent
      }
    }
    ctx.putImageData(peakImg,0,0);
    const focusScore = countMag ? (sumMag / countMag).toFixed(1) : '0';
    focusScoreEl.textContent = focusScore;
  }

  function refreshPeaking() {
    if (!peakingEnabled) return;
    const img = document.getElementById('test-image');
    if (!img) return;
    computeFocusPeaks(img);
    // Match canvas display size & position precisely to the rendered image box
    const displayImg = img.getBoundingClientRect();
    const wrapperRect = document.getElementById('image-wrapper').getBoundingClientRect();
    peakingCanvas.style.width = displayImg.width + 'px';
    peakingCanvas.style.height = displayImg.height + 'px';
    // If the image isn't at (0,0) inside wrapper, offset canvas
    const offsetLeft = displayImg.left - wrapperRect.left;
    const offsetTop = displayImg.top - wrapperRect.top;
    peakingCanvas.style.left = offsetLeft + 'px';
    peakingCanvas.style.top = offsetTop + 'px';
  }

  togglePeakingBtn.addEventListener('click', () => {
    peakingEnabled = !peakingEnabled;
    if (peakingEnabled) {
      togglePeakingBtn.textContent = 'Disable Focus Peaking';
      peakingCanvas.style.display = 'block';
      refreshPeaking();
    } else {
      togglePeakingBtn.textContent = 'Enable Focus Peaking';
      peakingCanvas.style.display = 'none';
      focusScoreEl.textContent = '-';
    }
  });
  thresholdSlider.addEventListener('input', refreshPeaking);
  intensitySlider.addEventListener('input', refreshPeaking);

  window.addEventListener('resize', refreshPeaking);

  document.getElementById('capture-btn').onclick = function() {
    document.getElementById('status').textContent = 'Capturing...';
    const method = selectEl.value;
    fetch('/api/capture-test-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ method })
    })
      .then(response => response.json())
      .then(data => {
        if (data.image_url) {
          document.getElementById('status').textContent = 'Image captured!';
          // Show the image
          document.getElementById('image-container').innerHTML = `<img id="test-image" src="${data.image_url}?t=${Date.now()}" alt="Test Image" />`;
          const imgEl = document.getElementById('test-image');
          imgEl.onload = () => {
            enableControlsAfterImage();
            if (peakingEnabled) refreshPeaking();
          };
        } else {
          document.getElementById('status').textContent = 'Error: ' + (data.error || 'Unknown error');
          document.getElementById('image-container').innerHTML = '';
        }
      })
      .catch(err => {
        document.getElementById('status').textContent = 'Error: ' + err;
        document.getElementById('image-container').innerHTML = '';
      });
  };
</script>
</body>
</html>
