<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sets</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Sidebar Navigation */
    .sidebar {
      position: fixed;
      left: -250px;
      top: 0;
      width: 250px;
      height: 100vh;
      background: #343a40;
      transition: left 0.3s ease;
      z-index: 1050;
      overflow-y: auto;
    }
    
    .sidebar.open {
      left: 0;
    }
    
    .sidebar .nav-link {
      color: #fff;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
      transition: background 0.2s;
    }
    
    .sidebar .nav-link:hover {
      background: #495057;
      color: #fff;
    }
    
    .sidebar .nav-link.active {
      background: #007bff;
    }
    
    .sidebar-header {
      padding: 20px;
      background: #212529;
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
    }
    
    .menu-toggle {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 1051;
      background: #343a40;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .menu-toggle:hover {
      background: #495057;
    }
    
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1049;
      display: none;
    }
    
    .sidebar-overlay.show {
      display: block;
    }
    
    .page-content {
      transition: margin-left 0.3s ease;
    }
    /* Force left alignment for this page */
    .page-content, .page-content h1, .page-content h2, .page-content h3,
    .page-content p, .page-content label, .page-content .card-title,
    .page-content .form-group, .page-content ul, .page-content li {
      text-align: left !important;
    }
    .page-content img, .page-content canvas { display:block; margin-left:0; }
  </style>
</head>
<body>

<!-- Menu Toggle Button -->
<button class="menu-toggle" id="menuToggle">☰ Menu</button>

<!-- Sidebar Navigation -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    Lego Timelapse
  </div>
  <nav>
    <a href="/control" class="nav-link">Control</a>
    <a href="/viewer" class="nav-link">Viewer</a>
    <a href="/sets" class="nav-link active">Sets</a>
    <a href="/active-set" class="nav-link">Set Active Set</a>
    <a href="/wslog" class="nav-link">Web Socket Log</a>
    <a href="/images" class="nav-link">Images</a>
    <a href="/camera-test" class="nav-link">Camera Test</a>
    <a href="/video-stream" class="nav-link">Video Stream</a>
  </nav>
</div>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="page-content">
<div class="container">
  <div class="row">
    <div class="col">
      <h1><a href="/">Lego Timelapse</a> - Sets</h1>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div id="sets"></div>
      <br />
      <div class="form-inline">
        <input type="text" id="setId" placeholder="Set ID" class="form-control mr-2" />
        <input type="text" id="setName" placeholder="Set Name" class="form-control mr-2" />
        <button id="addSet" class="btn btn-primary mr-2">Add Set</button>
        <button id="saveSets" class="btn btn-success">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script type="text/javascript">
        fetch('/api/sets').then(response => response.json()).then(data => {
            var sets = data['sets'];
            var sets_div = document.getElementById('sets');
            sets.forEach(set => {
                var set_div = document.createElement('div');
                set_div.innerHTML = `<h2>${set['name']} (${set['id']})</h2>`;
                set_div.className = 'card mb-3';
                var card_body = document.createElement('div');
                card_body.className = 'card-body';
                var title = document.createElement('h5');
                title.className = 'card-title';
                title.textContent = `${set['name']} (${set['id']})`;
                card_body.appendChild(title);
                var instructions_div = document.createElement('div');
                instructions_div.className = 'mb-2';
                set['instructions'].forEach(instruction => {
                    var instruction_div = document.createElement('div');
                    instruction_div.innerHTML = `<a href="/instructions/${set['id']}/${instruction}">${instruction}</a>&nbsp;&nbsp;`;
                    instructions_div.appendChild(instruction_div);
                });
                card_body.appendChild(instructions_div);
                // Add a button to add an instruction
                var add_instruction_button = document.createElement('button');
                add_instruction_button.className = 'btn btn-sm btn-primary mr-2';
                add_instruction_button.textContent = 'Add Instruction';
                add_instruction_button.onclick = () => {
                    // Prompt the user for the instruction file, upload it to the server, and add it to
                    // the set using the file name as the instruction name
                    var file_input = document.createElement('input');
                    file_input.type = 'file';
                    file_input.onchange = () => {
                        var file = file_input.files[0];
                        var formData = new FormData();
                        formData.append('pdf', file);

                        fetch(`/instructions/${set['id']}`, {
                            method: 'POST',
                            body: formData
                        })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Network response was not ok');
                            }
                            return response.json();
                        })
                        .then(data => {
                            console.log('Success:', data);
                            // Get the instruction name from the file name, stripping the extension
                            filename = file.name.split('.').slice(0, -1).join('.');
                            // Add the instruction to the set
                            set['instructions'].push( filename );
                            var instruction_div = document.createElement('div');
                            instruction_div.innerHTML = `<a href="/instructions/${set['id']}/${filename}">${filename}</a>&nbsp;&nbsp;`;
                            instructions_div.appendChild(instruction_div);
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('Upload failed');
                        });
                    };
                    file_input.click();
                };
                card_body.appendChild(add_instruction_button);
                // Add a button to delete the set
                var delete_button = document.createElement('button');
                delete_button.className = 'btn btn-sm btn-danger';
                delete_button.textContent = 'Delete Set';
                delete_button.onclick = () => {
                    fetch(`/api/sets/${set['id']}`, {
                        method: 'DELETE'
                    }).then(() => {
                        set_div.remove();
                    });
                };
                card_body.appendChild(delete_button);
                set_div.appendChild(card_body);
                sets_div.appendChild(set_div);
            });
        });

        // Add a set
        document.getElementById('addSet').onclick = () => {
            var setId = document.getElementById('setId').value;
            var setName = document.getElementById('setName').value;
            fetch('/api/sets', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    id: setId,
                    name: setName,
                    instructions: []
                })
            }).then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            }).then(data => {
                console.log('Success:', data);
                var sets_div = document.getElementById('sets');
                var set_div = document.createElement('div');
                set_div.className = 'card mb-3';
                var card_body = document.createElement('div');
                card_body.className = 'card-body';
                var title = document.createElement('h5');
                title.className = 'card-title';
                title.textContent = `${setName} (${setId})`;
                card_body.appendChild(title);
                var instructions_div = document.createElement('div');
                instructions_div.className = 'mb-2';
                card_body.appendChild(instructions_div);
                // Add a button to add an instruction
                var add_instruction_button = document.createElement('button');
                add_instruction_button.className = 'btn btn-sm btn-primary mr-2';
                add_instruction_button.textContent = 'Add Instruction';
                add_instruction_button.onclick = () => {
                    // Prompt the user for the instruction file, upload it to the server, and add it to
                    // the set using the file name as the instruction name
                    var file_input = document.createElement('input');
                    file_input.type = 'file';
                    file_input.onchange = () => {
                        var file = file_input.files[0];
                        var formData = new FormData();
                        formData.append('pdf', file);

                        fetch(`/instructions/${setId}`, {
                            method: 'POST',
                            body: formData
                        })
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('Network response was not ok');
                            }
                            return response.json();
                        })
                        .then(data => {
                            console.log('Success:', data);
                            // Get the instruction name from the file name, stripping the extension
                            filename = file.name.split('.').slice(0, -1).join('.');
                            // Add the instruction to the set
                            data['instructions'].push( filename );
                            var instruction_div = document.createElement('div');
                            instruction_div.innerHTML = `<a href="/instructions/${setId}/${filename}">${filename}</a>&nbsp;&nbsp;`;
                            instructions_div.appendChild(instruction_div);
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('Upload failed');
                        });
                    };
                    file_input.click();
                };
                card_body.appendChild(add_instruction_button);
                // Add a button to delete the set
                var delete_button = document.createElement('button');
                delete_button.className = 'btn btn-sm btn-danger';
                delete_button.textContent = 'Delete Set';
                delete_button.onclick = () => {
                    fetch(`/api/sets/${setId}`, {
                        method: 'DELETE'
                    }).then(() => {
                        set_div.remove();
                    });
                };
                card_body.appendChild(delete_button);
                set_div.appendChild(card_body);
                sets_div.appendChild(set_div);
            }).catch(error => {
                console.error('Error:', error);
                alert('Add set failed');
            });
        };

    // Sidebar toggle functionality
    (function() {
      const menuToggle = document.getElementById('menuToggle');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      
      menuToggle.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      });
      
      overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      });
    })();
    </script>

</div>
</body>
</html>
