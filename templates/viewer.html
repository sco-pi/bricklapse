<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lego Timelapse - Viewer</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://mozilla.github.io/pdf.js/build/pdf.mjs" type="module"></script>
  <style>
    /* Sidebar Navigation */
    .sidebar {
      position: fixed;
      left: -250px;
      top: 0;
      width: 250px;
      height: 100vh;
      background: #343a40;
      transition: left 0.3s ease;
      z-index: 1050;
      overflow-y: auto;
    }
    
    .sidebar.open {
      left: 0;
    }
    
    .sidebar .nav-link {
      color: #fff;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
      transition: background 0.2s;
    }
    
    .sidebar .nav-link:hover {
      background: #495057;
      color: #fff;
    }
    
    .sidebar .nav-link.active {
      background: #007bff;
    }
    
    .sidebar-header {
      padding: 20px;
      background: #212529;
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
    }
    
    .menu-toggle {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 1051;
      background: #343a40;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .menu-toggle:hover {
      background: #495057;
    }
    
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1049;
      display: none;
    }
    
    .sidebar-overlay.show {
      display: block;
    }
    
    .page-content {
      transition: margin-left 0.3s ease;
    }
  </style>
</head>
<body>

<!-- Menu Toggle Button -->
<button class="menu-toggle" id="menuToggle">☰ Menu</button>

<!-- Sidebar Navigation -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    Lego Timelapse
  </div>
  <nav>
    <a href="/control" class="nav-link">Control</a>
    <a href="/viewer" class="nav-link active">Viewer</a>
    <a href="/sets" class="nav-link">Sets</a>
    <a href="/active-set" class="nav-link">Set Active Set</a>
    <a href="/wslog" class="nav-link">Web Socket Log</a>
    <a href="/images" class="nav-link">Images</a>
    <a href="/camera-test" class="nav-link">Camera Test</a>
    <a href="/video-stream" class="nav-link">Video Stream</a>
  </nav>
</div>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="page-content">
<div class="container-fluid">
  <div class="row">
    <div class="col">
      <h1><a href="/">Lego Timelapse</a> - Viewer</h1>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <span>Page: <span id="page_num"></span> / <span id="page_count"></span></span>&nbsp;<button id="follow_ws_updates" class="btn btn-primary">Follow Updates</button>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <canvas id="the-canvas"></canvas>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script type="module">
  // If absolute URL from the remote server is provided, configure the CORS
  // header on that server.
  var url = '/instructions/42158/6501852',
      pageNum = 1;

  function parsePositivePage(pageValue, fallback = 1) {
    const parsed = Number.parseInt(pageValue, 10);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
  }

  function isSafePathSegment(segment) {
    // Allow common instruction/set id characters and spaces.
    return /^[A-Za-z0-9._()\-% ]+$/.test(segment);
  }

  function normalizeDocumentUrl(docUrl) {
    if (typeof docUrl !== 'string') {
      return null;
    }

    const trimmed = docUrl.trim();
    if (trimmed === '') {
      return null;
    }

    const parts = trimmed.split('/');
    if (parts.length !== 4 || parts[0] !== '' || parts[1] !== 'instructions') {
      return null;
    }

    let setId;
    let instructionId;
    try {
      setId = decodeURIComponent(parts[2]).trim();
      instructionId = decodeURIComponent(parts[3]).trim();
    } catch (_error) {
      return null;
    }

    if (!setId || !instructionId) {
      return null;
    }

    if (!isSafePathSegment(setId) || !isSafePathSegment(instructionId)) {
      return null;
    }

    return '/instructions/' + encodeURIComponent(setId) + '/' + encodeURIComponent(instructionId);
  }

  function isValidDocumentUrl(docUrl) {
    return normalizeDocumentUrl(docUrl) !== null;
  }

  // Get starting page/doc from /api/status endpoint
    await fetch('/api/status')
        .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
        })
        .then(data => {
        const normalizedStatusUrl = normalizeDocumentUrl(data['document']);
        if (normalizedStatusUrl) {
          url = normalizedStatusUrl;
        }
        pageNum = parsePositivePage(data['page'], pageNum);
        })
        .catch(error => {
        console.error('Error:', error);
        alert('Failed to get status');
        });

  // Loaded via <script> tag, create shortcut to access PDF.js exports.
  var { pdfjsLib } = globalThis;

  // The workerSrc property shall be specified.
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://mozilla.github.io/pdf.js/build/pdf.worker.mjs';

  var pdfDoc = null,
      pageRendering = false,
      pageNumPending = null,
      scale = 2,
      canvas = document.getElementById('the-canvas'),
      ctx = canvas.getContext('2d');

  /**
   * Get page info from document, resize canvas accordingly, and render page.
   * @param num Page number.
   */
  function renderPage(num) {
    pageRendering = true;
    // Using promise to fetch the page
    pdfDoc.getPage(num).then(function(page) {
      var viewport = page.getViewport({scale: scale});
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      // Render PDF page into canvas context
      var renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };
      var renderTask = page.render(renderContext);

      // Wait for rendering to finish
      renderTask.promise.then(function() {
        pageRendering = false;
        if (pageNumPending !== null) {
          // New page rendering is pending
          renderPage(pageNumPending);
          pageNumPending = null;
        }
      });
    });

    // Update page counters
    document.getElementById('page_num').textContent = num;
  }

  /**
   * If another page rendering in progress, waits until the rendering is
   * finised. Otherwise, executes rendering immediately.
   */
  function queueRenderPage(num) {
    if (pageRendering) {
      pageNumPending = num;
    } else {
      renderPage(num);
    }
  }

  function loadPdfDocument(docUrl, targetPage) {
    const normalizedUrl = normalizeDocumentUrl(docUrl);
    if (!normalizedUrl) {
      console.warn('Skipping PDF load due to invalid URL:', docUrl);
      return;
    }

    url = normalizedUrl;
    pageNum = parsePositivePage(targetPage, 1);

    pdfjsLib.getDocument({url: url}).promise.then(function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById('page_count').textContent = pdfDoc.numPages;
      queueRenderPage(pageNum);
    }).catch(function(error) {
      console.error('Failed to load PDF document:', error);
    });
  }

  /**
   * Asynchronously downloads PDF.
   */
  loadPdfDocument(url, pageNum);

  var follow_ws_updates = false;

  // Show the PDF Page in fullscreen
  // Additionally start checking for updates from the server every 1 second
  document.getElementById('the-canvas').addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
      follow_ws_updates = false;
    } else {
      document.getElementById('the-canvas').requestFullscreen();
      follow_ws_updates = true;
    }
  });

  // Setup websocket to listen for updates from the server
  var client_id = Date.now();
  var ws;
  var ws_reconnect_interval = 1000;

  function connectWebSocket() {
    ws = new WebSocket(`ws://${window.location.host}/ws/${client_id}`);

    ws.onmessage = function(event) {
      var data = JSON.parse(event.data);
      if (follow_ws_updates) {
        // If the update has a 'instructions' key, update the document
        if (data.instructions) {
          const incomingDocument = normalizeDocumentUrl(data.instructions.document);
          const incomingPage = parsePositivePage(data.instructions.page, pageNum);

          // Check if page changed within same document
          if (incomingPage !== pageNum && incomingDocument && incomingDocument === url) {
            pageNum = incomingPage;
            queueRenderPage(pageNum);
          }
          
          // Check if document changed
          if (incomingDocument && incomingDocument !== url) {
            loadPdfDocument(incomingDocument, incomingPage);
          }
        }
      }
    };

    ws.onclose = function(event) {
      console.log('WebSocket is closed. Reconnect will be attempted in 1 second.', event.reason);
      setTimeout(connectWebSocket, ws_reconnect_interval);
    };

    ws.onerror = function(err) {
      console.error('WebSocket encountered error: ', err.message, 'Closing socket');
      ws.close();
    };
  }

  document.getElementById('follow_ws_updates').addEventListener('click', () => {
    follow_ws_updates = !follow_ws_updates;
    if (follow_ws_updates) {
      document.getElementById('follow_ws_updates').textContent = 'Stop Following Updates';
    } else {
      document.getElementById('follow_ws_updates').textContent = 'Follow Updates';
    }
  });

  connectWebSocket();

  // Sidebar toggle functionality
  (function() {
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    
    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  })();
</script>

</div>
</body>
</html>
