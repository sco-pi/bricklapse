<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lego Timelapse Image Viewer</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://mozilla.github.io/pdf.js/build/pdf.mjs" type="module"></script>
  <style>
    /* Sidebar Navigation */
    .sidebar {
      position: fixed;
      left: -250px;
      top: 0;
      width: 250px;
      height: 100vh;
      background: #343a40;
      transition: left 0.3s ease;
      z-index: 1050;
      overflow-y: auto;
    }
    
    .sidebar.open {
      left: 0;
    }
    
    .sidebar .nav-link {
      color: #fff;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
      transition: background 0.2s;
    }
    
    .sidebar .nav-link:hover {
      background: #495057;
      color: #fff;
    }
    
    .sidebar .nav-link.active {
      background: #007bff;
    }
    
    .sidebar-header {
      padding: 20px;
      background: #212529;
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
    }
    
    .menu-toggle {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 1051;
      background: #343a40;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .menu-toggle:hover {
      background: #495057;
    }
    
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1049;
      display: none;
    }
    
    .sidebar-overlay.show {
      display: block;
    }
    
    .page-content {
      transition: margin-left 0.3s ease;
    }
  </style>
</head>
<body>

<!-- Menu Toggle Button -->
<button class="menu-toggle" id="menuToggle">☰ Menu</button>

<!-- Sidebar Navigation -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    Lego Timelapse
  </div>
  <nav>
    <a href="/control" class="nav-link">Control</a>
    <a href="/viewer" class="nav-link">Viewer</a>
    <a href="/sets" class="nav-link">Sets</a>
    <a href="/active-set" class="nav-link">Set Active Set</a>
    <a href="/wslog" class="nav-link">Web Socket Log</a>
    <a href="/images" class="nav-link active">Images</a>
    <a href="/camera-test" class="nav-link">Camera Test</a>
    <a href="/video-stream" class="nav-link">Video Stream</a>
  </nav>
</div>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="page-content">
<div class="container-fluid">
  <div class="row">
    <div class="col">
      <h1><a href="/">Lego Timelapse</a> - Image Viewer</h1>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <!-- Drop Down for Set selection -->
      Set <select id="set_select">
        <option>Select Set</option>
      </select>
      <!-- Drop Down for Phase selection -->
      Phase <select id="phase_select">
        <option>Select Phase</option>
        <option value="sort">Sort</option>
        <option value="build">Build</option>
        <option value="build1">Build Alternate 1</option>
        <option value="build2">Build Alternate 2</option>
        <option value="build3">Build Alternate 3</option>
        <option value="installing_lights">Installing Lights</option>
        <option value="disassemble">Disassemble</option>
      </select>
      <!-- Button to get images -->
      <button id="get_images" class="btn btn-primary">Get All Images</button>
      <!-- Button to get first, middle, and last 5 images -->
      <button id="get_sample_images" class="btn btn-primary">Get Sample Images</button>
      <!-- Button to add overlay to all visible images -->
      <button id="add_overlay" class="btn btn-primary">Add Overlay</button>
      &nbsp;
      <!-- Exposure adjustments -->
      <div class="exposure-controls" style="display: inline-block; margin-left: 10px; margin-right: 10px; padding: 5px; border: 1px solid #ccc; border-radius: 5px;">
        <div class="form-row align-items-center">
          <div class="col">
            <label for="brightness">Brightness:</label>
            <input type="range" id="brightness" min="-100" max="100" value="0" step="1" style="width: 150px;">
            <input type="number" id="brightness_text" min="-100" max="100" value="0" class="form-control form-control-sm" style="width: 65px; display: inline-block;">
          </div>
          
          <div class="col">
            <label for="contrast">Contrast:</label>
            <input type="range" id="contrast" min="-100" max="100" value="0" step="1" style="width: 150px;">
            <input type="number" id="contrast_text" min="-100" max="100" value="0" class="form-control form-control-sm" style="width: 65px; display: inline-block;">
          </div>
          
          <div class="col-auto">
            <button id="reset_exposure" class="btn btn-secondary btn-sm">Reset</button>
            <button id="preview_exposure" class="btn btn-info btn-sm">Preview</button>
          </div>
        </div>
      </div>
      &nbsp;
      <!-- Button to start encoding -->
      <button id="start_encoding" class="btn btn-primary">Start Encoding</button>
    </div>
  </div>
  <!-- Grid of images -->
  <div class="row">
    <div class="col" id="images">
    </div>
  </div>
<div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script type="module">
  // Get set's from the server to populate the set_select dropdown
  fetch('api/sets/').then(response => response.json()).then(data => {
    var sets = data['sets'];
    var set_select = document.getElementById('set_select');
    sets.forEach(this_set => {
      var option = document.createElement('option');
      option.value = this_set['id'];
      option.text = this_set['name'] + ' (' + this_set['id'] + ')';
      set_select.appendChild(option);
    });
  });

  // Get images for the selected set and phase
  document.getElementById('get_images').addEventListener('click', function() {
    var set_id = document.getElementById('set_select').value;
    var phase = document.getElementById('phase_select').value;
    var images_div = document.getElementById('images');
    images_div.innerHTML = '';
    fetch('/api/images/' + set_id + '/' + phase + '?date=' + Date.now()).then(response => response.json()).then(data => {
      data.forEach(image => {
        // Create thumbnail div for each image
        var thumbnail_div = document.createElement('div');
        thumbnail_div.classList.add('img-thumbnail');
        thumbnail_div.style = 'display: inline-block; margin: 5px;';

        var img = document.createElement('img');
        img.src = image['url'];
        img.style = 'max-width: 200px;';
        //img.classList.add('img-rounded');
        //img.classList.add('img-fluid');
        thumbnail_div.appendChild(img);
        
        var caption_div = document.createElement('div');
        caption_div.classList.add('caption');
        // Add caption to the image with the image's filename
        var caption = document.createElement('p');
        caption.innerHTML = image['filename'];
        caption_div.appendChild(caption);
        thumbnail_div.appendChild(caption_div);

        images_div.appendChild(thumbnail_div);
      });
    });
  });

  // Get sample images for the selected set and phase
  document.getElementById('get_sample_images').addEventListener('click', function() {
    var set_id = document.getElementById('set_select').value;
    var phase = document.getElementById('phase_select').value;
    var images_div = document.getElementById('images');
    images_div.innerHTML = '';
    fetch('/api/images/' + set_id + '/' + phase + '?date=' + Date.now()).then(response => response.json()).then(data => {
      // Build list of first, middle, and last 5 images
      var sample_images = data.slice(0, 5).concat(data.slice(data.length / 2 - 2, data.length / 2 + 3)).concat(data.slice(data.length - 5, data.length));
      sample_images.forEach(image => {
        // Create thumbnail div for each image
        var thumbnail_div = document.createElement('div');
        thumbnail_div.classList.add('img-thumbnail');
        thumbnail_div.style = 'display: inline-block; margin: 5px;';

        var img = document.createElement('img');
        img.src = image['url'];
        img.style = 'max-width: 200px;';
        //img.classList.add('img-rounded');
        //img.classList.add('img-fluid');
        thumbnail_div.appendChild(img);
        
        var caption_div = document.createElement('div');
        caption_div.classList.add('caption');
        // Add caption to the image with the image's filename
        var caption = document.createElement('p');
        caption.innerHTML = image['filename'];
        caption_div.appendChild(caption);
        thumbnail_div.appendChild(caption_div);

        images_div.appendChild(thumbnail_div);
      });
    });
  });

  // Handle exposure sliders and text inputs synchronization
  document.getElementById('brightness').addEventListener('input', function() {
    document.getElementById('brightness_text').value = this.value;
    updatePreview();
  });
  
  document.getElementById('brightness_text').addEventListener('input', function() {
    // Ensure value is within range
    const value = Math.min(100, Math.max(-100, parseInt(this.value) || 0));
    this.value = value;
    document.getElementById('brightness').value = value;
    updatePreview();
  });
  
  document.getElementById('contrast').addEventListener('input', function() {
    document.getElementById('contrast_text').value = this.value;
    updatePreview();
  });
  
  document.getElementById('contrast_text').addEventListener('input', function() {
    // Ensure value is within range
    const value = Math.min(100, Math.max(-100, parseInt(this.value) || 0));
    this.value = value;
    document.getElementById('contrast').value = value;
    updatePreview();
  });
  
  // Reset exposure controls
  document.getElementById('reset_exposure').addEventListener('click', function() {
    document.getElementById('brightness').value = 0;
    document.getElementById('brightness_text').value = 0;
    document.getElementById('contrast').value = 0;
    document.getElementById('contrast_text').value = 0;
    
    // Remove any applied CSS filters from the images
    var images = document.getElementById('images').getElementsByTagName('img');
    for (var i = 0; i < images.length; i++) {
      images[i].style.filter = '';
    }
  });
  
  // Helper function to update preview with current settings
  function updatePreview() {
    const brightness = document.getElementById('brightness').value;
    const contrast = document.getElementById('contrast').value;
    
    let filterValue = '';
    if (brightness != 0) {
      filterValue += `brightness(${100 + parseInt(brightness)}%) `;
    }
    if (contrast != 0) {
      filterValue += `contrast(${100 + parseInt(contrast)}%)`;
    }
    
    return filterValue;
  }

  // Preview exposure adjustments on the displayed images
  document.getElementById('preview_exposure').addEventListener('click', function() {
    const filterValue = updatePreview();
    
    const images = document.getElementById('images').getElementsByTagName('img');
    for (let i = 0; i < images.length; i++) {
      images[i].style.filter = filterValue;
    }
  });

  // Start encoding the images
  document.getElementById('start_encoding').addEventListener('click', function() {
    const set_id = document.getElementById('set_select').value;
    // Confirm a set is selected
    if (set_id == 'Select Set') {
      alert('Please select a set');
      return;
    }
    const phase = document.getElementById('phase_select').value;
    // Confirm a phase is selected
    if (phase == 'Select Phase') {
      alert('Please select a phase');
      return;
    }
    
    // Get exposure settings from the text inputs for more precise values
    const brightness = document.getElementById('brightness_text').value;
    const contrast = document.getElementById('contrast_text').value;
    
    // Show a confirmation dialog with the current settings
    if (confirm(`Start encoding with the following settings?\n\nBrightness: ${brightness}\nContrast: ${contrast}`)) {
      fetch('/api/images/' + set_id + '/' + phase + '/encode', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ 
          date: Date.now(),
          exposure: {
            brightness: parseInt(brightness),
            contrast: parseInt(contrast)
          }
        })
      }).then(response => response.json()).then(data => {
        alert('Encoding started with exposure adjustments');
      }).catch(error => {
        console.error('Error starting encoding:', error);
        alert('Error starting encoding: ' + error.message);
      });
    }
  });

  // Overlay green bounding box on image to show the area that will be cropped for encoding
  // This should be 4x5 aspect ratio in the center of the image
  function overlayBoundingBox(image) {
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    var width = image.width;
    var height = image.height;
    var aspect_ratio = 4 / 5;

    // Draw the base image on the canvas
    canvas.width = width;
    canvas.height = height;
    ctx.drawImage(image, 0, 0, width, height);

    // Calculate the size of the bounding box
    var box_width = width;
    var box_height = box_width / aspect_ratio;
    if (box_height > height) {
      box_height = height;
      box_width = box_height * aspect_ratio;
    }

    // Calculate the position of the bounding box
    var box_x = (width - box_width) / 2;
    var box_y = (height - box_height) / 2;

    // Draw the bounding box
    ctx.strokeStyle = 'green';
    ctx.lineWidth = 5;
    ctx.strokeRect(box_x, box_y, box_width, box_height);

    // Replace the image with the canvas
    image.parentNode.replaceChild(canvas, image);

    // Add the image to the canvas
    canvas.appendChild(image);
  }

  // Remove the overlay from the image
  function removeOverlay(image) {
    var canvas = image.parentNode;
    canvas.parentNode.replaceChild(image, canvas);
  }

  // Add the overlay to all visible images when the add_overlay button is clicked
  document.getElementById('add_overlay').addEventListener('click', function() {
    // If the text of the button is "Remove Overlay", remove the overlay from all images
    var addOrRemove = document.getElementById('add_overlay').innerHTML == 'Add Overlay';

    var images = document.getElementById('images').getElementsByTagName('img');
    for (var i = 0; i < images.length; i++) {
      if (addOrRemove) {
        overlayBoundingBox(images[i]);
      } else {
        removeOverlay(images[i]);
      }
    }

    
    // Update the button text to reflect the action that will be taken next
    document.getElementById('add_overlay').innerHTML = addOrRemove ? 'Remove Overlay' : 'Add Overlay';
  });

  // Sidebar toggle functionality
  (function() {
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    
    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  })();
</script>

</div>
</body>
</html>
